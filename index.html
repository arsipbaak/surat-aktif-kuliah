<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem E-Surat POLTERA</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
    .hide { display: none !important; }
    .kertas-dokumen {
      width: 100%; max-width: 650px; aspect-ratio: 1 / 1.414; background-color: white; padding: 45px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15); font-family: 'Times New Roman', Times, serif; color: #000;
      font-size: 13px; line-height: 1.5; position: relative;
    }
  </style>
  <script>tailwind.config = { theme: { extend: { colors: { 'poltera-navy': '#1e3a8a', 'poltera-accent': '#f59e0b', 'poltera-dark': '#0f172a' } } } }</script>
</head>
<body class="text-slate-800">

  <div id="login-screen" class="min-h-screen flex items-center justify-center relative overflow-hidden bg-gradient-to-br from-poltera-dark via-slate-800 to-poltera-navy p-4">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-[100px] opacity-30"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-poltera-accent rounded-full mix-blend-multiply filter blur-[100px] opacity-20"></div>

    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center transform transition duration-500 relative z-10">
      <div class="mb-8">
       
        <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight uppercase">Poltera E-Surat</h1>
        <p class="text-xs font-semibold text-slate-400 mt-1 uppercase tracking-wider">Layanan Dokumen Digital Akademik</p>
      </div>

      <div id="role-selection-section" class="space-y-3.5">
        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider text-left pl-1 border-b border-slate-100 pb-2">Pilih Portal Akses:</p>
        <button onclick="bukaFormKredensial('mahasiswa')" class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-blue-50/80 border border-slate-200 rounded-xl text-left transition group">
          <div class="flex items-center gap-3.5">
            <div class="w-10 h-10 rounded-lg bg-blue-100 text-poltera-navy flex items-center justify-center text-lg"><i class="fas fa-user-graduate"></i></div>
            <div><p class="font-bold text-sm text-slate-700">Mahasiswa</p><p class="text-[10px] text-slate-400">Login dengan NIM Anda</p></div>
          </div>
        </button>
        <button onclick="bukaFormKredensial('admin')" class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-emerald-50 border border-slate-200 rounded-xl text-left transition group">
          <div class="flex items-center gap-3.5">
            <div class="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg"><i class="fas fa-user-shield"></i></div>
            <div><p class="font-bold text-sm text-slate-700">Admin Akademik</p><p class="text-[10px] text-slate-400">Verifikator Antrean dan TTE Surat</p></div>
          </div>
        </button>
        <!--<button onclick="bukaFormKredensial('pimpinan')" class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-purple-50 border border-slate-200 rounded-xl text-left transition group">
          <div class="flex items-center gap-3.5">
            <div class="w-10 h-10 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center text-lg"><i class="fas fa-user-tie"></i></div>
            <div><p class="font-bold text-sm text-slate-700">Wakil Direktur I</p><p class="text-[10px] text-slate-400">Otorisasi Surat</p></div>
          </div>
        </button>-->
      </div>

      <div id="credential-form-section" class="hide space-y-4 text-left border border-slate-100 p-5 rounded-2xl bg-slate-50/50">
        <div class="flex items-center gap-2 mb-2">
          <button onclick="kembaliKePilihanRole()" class="text-slate-400 hover:text-poltera-navy"><i class="fas fa-arrow-left"></i></button>
          <span class="text-xs font-bold text-slate-500 uppercase tracking-widest" id="target-portal-label">Portal Verifikasi</span>
        </div>
        <form id="login-auth-form" onsubmit="prosesVerifikasiKredensial(event)">
          <div class="space-y-1 mb-3">
            <label class="block text-[11px] font-bold text-slate-500 uppercase" id="label-field-username">NIM / Username</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-user text-xs"></i></span>
              <input type="text" id="auth-username" required class="w-full pl-9 pr-4 py-2.5 border border-slate-200 rounded-lg text-xs focus:ring-1 outline-none font-semibold">
            </div>
          </div>
          <div class="space-y-1 mb-4" id="password-field-container">
            <label class="block text-[11px] font-bold text-slate-500 uppercase">Kata Sandi (Password)</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-lock text-xs"></i></span>
              <input type="password" id="auth-password" class="w-full pl-9 pr-4 py-2.5 border border-slate-200 rounded-lg text-xs focus:ring-1 outline-none font-semibold">
            </div>
          </div>
          <button type="submit" class="w-full bg-poltera-navy text-white text-xs font-bold py-3 rounded-xl shadow-md flex items-center justify-center gap-2">
            <i class="fas fa-sign-in-alt"></i> Autentikasi Pengguna
          </button>
        </form>
      </div>

  </div>

  <div id="app-screen" class="hide flex h-screen overflow-hidden">
    <aside class="w-64 bg-poltera-dark text-slate-200 flex flex-col z-20 shadow-2xl border-r border-slate-800">
      <div class="h-16 flex items-center justify-center gap-3 border-b border-slate-800 bg-slate-900/50">
        <div class="w-8 h-8 bg-gradient-to-tr from-poltera-accent to-amber-300 rounded flex items-center justify-center text-poltera-dark shadow">
  <img src="./logo-poltera.png" alt="Logo Poltera" class="w-5 h-5 object-contain">
</div>
        <span class="font-extrabold text-white tracking-widest uppercase text-lg">Poltera</span>
      </div>
      <div class="p-4 border-b border-slate-800 bg-slate-950/40 flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-poltera-navy text-white flex items-center justify-center font-bold" id="nav-initial">U</div>
        <div class="overflow-hidden">
          <p class="text-xs font-bold text-white truncate" id="nav-user-name">User Name</p>
          <p class="text-[9px] text-slate-400 uppercase tracking-widest font-semibold" id="nav-user-role">Role</p>
        </div>
      </div>
      <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto" id="nav-menu"></nav>
      <div class="p-4 border-t border-slate-800">
        <button onclick="handleLogout()" class="w-full py-2.5 bg-red-600/10 hover:bg-red-600 text-red-400 hover:text-white rounded-xl text-xs font-bold transition flex justify-center gap-2">
          <i class="fas fa-sign-out-alt"></i> Keluar Aplikasi
        </button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
      <header class="bg-white border-b px-6 py-4 flex justify-between items-center z-10 shadow-sm">
        <div>
          <h3 class="text-lg font-bold text-slate-800" id="header-title">Dashboard</h3>
          <p class="text-xs text-slate-400" id="header-desc">Selamat datang di portal e-surat</p>
        </div>
        <div class="flex items-center gap-4">
          <button onclick="window.open('https://drive.google.com/file/d/1rGxNVwCUmkZ1WmKe3n-ym3QBjlROcBgl/view?usp=drive_link', '_blank')" class="hidden md:flex bg-white border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm">
            <i class="fas fa-file-excel text-emerald-600"></i> Contoh Surat

  </div>

  <template id="view-dashboard">
    <div class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-blue-50 text-poltera-navy flex items-center justify-center text-xl shadow-inner"><i class="fas fa-file-invoice"></i></div>
          <div><p class="text-xs font-semibold text-slate-400">Total Pengajuan</p><p class="text-2xl font-bold text-slate-800" id="stat-total">0</p></div>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl shadow-inner"><i class="fas fa-spinner fa-spin"></i></div>
          <div><p class="text-xs font-semibold text-slate-400">Menunggu Verifikasi</p><p class="text-2xl font-bold text-slate-800" id="stat-pending">0</p></div>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl shadow-inner"><i class="fas fa-check-circle"></i></div>
          <div><p class="text-xs font-semibold text-slate-400">Disetujui / Selesai</p><p class="text-2xl font-bold text-slate-800" id="stat-done">0</p></div>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-xl shadow-inner"><i class="fas fa-ban"></i></div>
          <div><p class="text-xs font-semibold text-slate-400">Pengajuan Ditolak</p><p class="text-2xl font-bold text-slate-800" id="stat-rejected">0</p></div>
        </div>
      </div>
      <div class="bg-gradient-to-r from-poltera-navy to-slate-900 text-white rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="space-y-1.5">
          <h4 class="text-lg font-bold">Surat Keterangan Aktif Kuliah Digital</h4>
          <p class="text-xs text-slate-300 max-w-xl">Menggunakan tanda tangan elektronik berbasis QR Code yang terenkripsi aman.</p>
        </div>
        <button onclick="changeView('riwayat')" class="bg-poltera-accent px-5 py-3 rounded-xl font-bold text-xs"><i class="fas fa-list mr-1"></i> Tinjau Antrean</button>
      </div>
    </div>
  </template>

  <template id="view-pengajuan">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-100 p-6 shadow-sm space-y-6">
        <h4 class="font-bold text-base border-b pb-3">Form Permohonan Surat Pernyataan</h4>
        <form id="form-permohonan" class="space-y-6" onsubmit="doSubmitPermohonan(event)">
          <div class="space-y-4">
            <h5 class="text-xs font-bold text-poltera-navy uppercase border-b pb-1 tracking-wider">A. Informasi Akademik</h5>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div><label class="block text-xs font-semibold text-slate-400 mb-1">Nama Lengkap</label><input type="text" id="mhs-nama" readonly class="w-full bg-slate-100 border p-3 text-xs rounded-xl"></div>
              <div><label class="block text-xs font-semibold text-slate-400 mb-1">NIM</label><input type="text" id="mhs-nim" readonly class="w-full bg-slate-100 border p-3 text-xs rounded-xl"></div>
              <div class="col-span-2 md:col-span-1"><label class="block text-xs font-semibold text-slate-400 mb-1">Prodi</label><input type="text" id="mhs-prodi" readonly class="w-full bg-slate-100 border p-3 text-xs rounded-xl"></div>
              <div class="grid grid-cols-3 gap-2 col-span-2 md:col-span-1">
                <div><label class="block text-[11px] font-semibold text-slate-400 mb-1">Semester</label><input type="text" id="mhs-semester" readonly class="w-full bg-slate-100 border p-3 text-xs rounded-xl text-center"></div>
                <div><label class="block text-[11px] font-semibold text-slate-400 mb-1">Thn Akademik</label><input type="text" id="mhs-tahun-akad" readonly class="w-full bg-slate-100 border p-3 text-xs rounded-xl text-center"></div>
                <div><label class="block text-[11px] font-semibold text-slate-400 mb-1">Lama Studi</label><input type="text" id="mhs-lama-studi" readonly class="w-full bg-slate-100 border p-3 text-xs rounded-xl text-center"></div>
              </div>
            </div>
          </div>
          <div class="space-y-4">
            <h5 class="text-xs font-bold text-poltera-navy uppercase border-b pb-1 tracking-wider">B. Data Orang Tua / Wali</h5>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div><label class="block text-xs font-semibold text-slate-500 mb-1">Nama Ortu/Wali *</label><input type="text" id="ortu-nama" required placeholder="Contoh: Slamet Abadi" required class="w-full border p-3 text-xs rounded-xl"></div>
              <div><label class="block text-xs font-semibold text-slate-500 mb-1">NIP Wali (- jika tidak ada)</label><input type="text" id="ortu-nip" required placeholder="Contoh: 19920622019061001" class="w-full border p-3 text-xs rounded-xl"></div>
              <div><label class="block text-xs font-semibold text-slate-500 mb-1">Pangkat/Golongan</label><input type="text" id="ortu-pangkat" required placeholder="Penata /III/b" class="w-full border p-3 text-xs rounded-xl"></div>
              <div><label class="block text-xs font-semibold text-slate-500 mb-1">Instansi / Unit Kerja *</label><input type="text" id="ortu-instansi" required placeholder="Contoh: Dinas Pendidikan Sampang" required class="w-full border p-3 text-xs rounded-xl"></div>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-t pt-4">
            <div><label class="block text-xs font-semibold text-slate-500 mb-1">No WhatsApp Aktif *</label><input type="text" id="mhs-hp" required placeholder="Contoh: 628123456789" required class="w-full border p-3 text-xs rounded-xl"></div>
            <div><label class="block text-xs font-semibold text-slate-500 mb-1">Keperluan *</label><select id="mhs-keperluan" required class="w-full border p-3 text-xs rounded-xl"></select></div>
          </div>
          <div class="text-right border-t pt-4"><button type="submit" class="bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold text-xs"><i class="fas fa-paper-plane mr-1.5"></i> Kirim Pengajuan</button></div>
        </form>
      </div>
    </div>

  <template id="view-riwayat">
    <div class="bg-white rounded-2xl border shadow-sm">
      <div class="p-5 border-b flex justify-between items-center bg-slate-50">
        <h4 class="font-bold text-base">Daftar Pengajuan Surat</h4>
        <input type="text" id="cari-input" onkeyup="handleFilterTable(this)" placeholder="Cari data..." class="border rounded-xl px-4 py-2 text-xs">
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse" id="main-table-data">
          <thead><tr class="bg-slate-100 text-slate-500 text-[10px] font-extrabold uppercase border-b"><th class="p-4">Tanggal</th><th class="p-4">No Surat</th><th class="p-4">Mahasiswa / NIM</th><th class="p-4">Keperluan</th><th class="p-4 text-center">Status</th><th class="p-4 text-center">Tindakan</th></tr></thead>
          <tbody class="text-xs divide-y divide-slate-100" id="table-body-target"></tbody>
        </table>
      </div>
    </div>
  </template>

  <div id="pdf-modal" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center hide p-4">
    <div class="bg-white rounded-2xl w-full max-w-4xl max-h-[92vh] flex flex-col">
      <div class="p-4 border-b flex justify-between items-center bg-slate-50">
        <h4 class="font-bold text-sm">Pratinjau Data Pengajuan</h4>
        <button onclick="closeModal()" class="text-slate-400 hover:text-rose-600"><i class="fas fa-times text-lg"></i></button>
      </div>
      <div class="p-6 overflow-y-auto flex-1 bg-slate-500/10 flex justify-center"><div class="kertas-dokumen" id="kertas-pdf-preview"></div></div>
      <div class="p-4 border-t flex justify-end"><button onclick="closeModal()" class="px-5 py-2.5 bg-slate-800 text-white rounded-xl text-xs font-bold">Tutup Pengecekan</button></div>
    </div>
  </div>

  <div id="reject-modal" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center hide p-4">
    <div class="bg-white rounded-2xl w-full max-w-md">
      <div class="p-5 border-b"><h4 class="font-bold text-sm">Alasan Penolakan</h4></div>
      <div class="p-5"><textarea id="reject-reason" rows="3" class="w-full border rounded-xl p-3 text-xs" placeholder="Masukkan alasan penolakan..."></textarea></div>
      <div class="p-4 border-t flex justify-end gap-2"><button onclick="closeRejectModal()" class="px-4 py-2 border rounded-xl text-xs font-bold">Batal</button><button onclick="submitRejectForm()" class="px-4 py-2 bg-rose-600 text-white rounded-xl text-xs font-bold">Tolak Berkas</button></div>
    </div>
  </div>

  <div id="app-toast" class="fixed bottom-5 right-5 bg-white border-l-4 border-slate-900 shadow-2xl rounded-xl px-5 py-4 hide flex items-center gap-3.5 z-50">
    <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-sm" id="toast-icon-box"></div>
    <div><h5 class="font-bold text-xs" id="toast-title">Notifikasi</h5><p class="text-[10px] text-slate-500" id="toast-desc">Memproses...</p></div>
  </div>


  <script>
    // -------------------------------------------------------------
    // WAJIB: GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA!!!
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzeMR30NCObTpwZOmEZ4RafoFMzMKSsAFeN1nJs0kSGY2c4PMnDo3-X8XOoE8qtaF1kVw/exec"; 
    // -------------------------------------------------------------

    let appState = { role: null, user: null, currentView: 'dashboard', db: [], selectedMhs: null, rejectTargetId: null };

    // HELPER UNTUK MENGHUBUNGI GOOGLE APPS SCRIPT
    async function apiGet(action, params = {}) {
      const url = new URL(GAS_API_URL);
      url.searchParams.append('action', action);
      for(let key in params) url.searchParams.append(key, params[key]);
      const res = await fetch(url);
      return await res.json();
    }

    async function apiPost(action, payload) {
      const form = new URLSearchParams();
      form.append('action', action);
      form.append('data', JSON.stringify(payload));
      const res = await fetch(GAS_API_URL, { method: 'POST', body: form });
      return await res.json();
    }

    window.onload = function() {
      document.getElementById('header-date').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      apiGet('getRiwayat', {role: 'all', nim: ''}).then(res => { if(res.status === 'success') appState.db = res.data; }).catch(err => console.log("Gagal memuat awal."));
    };

    let selectedAuthRole = '';
    function bukaFormKredensial(role) {
      selectedAuthRole = role;
      document.getElementById('role-selection-section').classList.add('hide');
      document.getElementById('credential-form-section').classList.remove('hide');
      const passContainer = document.getElementById('password-field-container');
      const passInput = document.getElementById('auth-password');
      if (role === 'mahasiswa') { passContainer.classList.add('hide'); passInput.removeAttribute('required'); } 
      else { passContainer.classList.remove('hide'); passInput.setAttribute('required', 'true'); }
    }
    function kembaliKePilihanRole() { document.getElementById('credential-form-section').classList.add('hide'); document.getElementById('role-selection-section').classList.remove('hide'); }

    // LOGIN MENGGUNAKAN FETCH KE BACKEND
    async function prosesVerifikasiKredensial(event) {
      event.preventDefault();
      const userVal = document.getElementById('auth-username').value.trim();
      const passVal = document.getElementById('auth-password').value;

      showToast("Memproses...", "Menghubungi server POLTERA...", "fa-spinner fa-spin");
      
      try {
        if (selectedAuthRole === 'mahasiswa') {
          const res = await apiGet('cekNIM', {nim: userVal});
          if (res.status === 'success') {
            appState.role = 'mahasiswa'; appState.selectedMhs = { ...res.data, nim: userVal };
            appState.user = { name: res.data.nama, nim: userVal, role: "Mahasiswa" };
            masukKeSistem();
          } else showToast("Ditolak", res.message, "fa-ban");
        } else {
          const res = await apiGet('loginAdmin', {username: userVal, password: passVal});
          if (res.status === 'success' && res.role === selectedAuthRole) {
            appState.role = res.role; appState.user = { name: res.name, role: res.role === 'admin' ? "Administrator" : "Wakil Direktur I" };
            masukKeSistem();
          } else showToast("Ditolak", res.message || "Akses tidak sesuai.", "fa-ban");
        }
      } catch (e) { showToast("Sistem Offline", "Gagal terhubung ke database.", "fa-wifi"); }
    }

    function masukKeSistem() {
      document.getElementById('nav-user-name').innerText = appState.user.name;
      document.getElementById('nav-user-role').innerText = appState.user.role;
      document.getElementById('nav-initial').innerText = appState.user.name.charAt(0);
      buildSidebarNavigation();
      document.getElementById('login-screen').classList.add('hide');
      document.getElementById('app-screen').classList.remove('hide');
      changeView('dashboard');
      showToast("Berhasil Login", `Selamat bekerja, ${appState.user.name}!`, "fa-check-circle");
    }

    function handleLogout() { appState.role = null; appState.user = null; document.getElementById('app-screen').classList.add('hide'); document.getElementById('login-screen').classList.remove('hide'); kembaliKePilihanRole(); }

    function buildSidebarNavigation() {
      let nav = `<button onclick="changeView('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-xs font-bold text-slate-400 hover:bg-slate-800 hover:text-white"><i class="fas fa-home text-sm"></i> Dashboard</button>`;
      if(appState.role === 'mahasiswa') {
        nav += `<button onclick="changeView('pengajuan')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-xs font-bold text-slate-400 hover:bg-slate-800 hover:text-white"><i class="fas fa-edit text-sm"></i> Ajukan Surat</button>
                <button onclick="changeView('riwayat')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-xs font-bold text-slate-400 hover:bg-slate-800 hover:text-white"><i class="fas fa-history text-sm"></i> Riwayat</button>`;
      } else {
        nav += `<button onclick="changeView('riwayat')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-xs font-bold text-slate-400 hover:bg-slate-800 hover:text-white"><i class="fas fa-tasks text-sm"></i> Antrean <span id="badge-nav-pending" class="bg-amber-500 text-white px-2 rounded-full ml-auto">0</span></button>`;
      }
      document.getElementById('nav-menu').innerHTML = nav;
    }

    function changeView(viewName) {
      appState.currentView = viewName;
      document.getElementById('view-wrapper').innerHTML = '';
      document.getElementById('view-wrapper').appendChild(document.getElementById(`view-${viewName}`).content.cloneNode(true));

      if(viewName === 'dashboard') { document.getElementById('header-title').innerText = "Dashboard Statistik"; fetchDatabaseMetrics(); } 
      else if(viewName === 'pengajuan') {
        document.getElementById('header-title').innerText = "Buat Pengajuan";
        if(appState.selectedMhs) {
          document.getElementById('mhs-nama').value = appState.selectedMhs.nama; document.getElementById('mhs-nim').value = appState.selectedMhs.nim;
          document.getElementById('mhs-prodi').value = appState.selectedMhs.prodi; document.getElementById('mhs-semester').value = appState.selectedMhs.semester;
          document.getElementById('mhs-tahun-akad').value = appState.selectedMhs.tahun_akademik; document.getElementById('mhs-lama-studi').value = appState.selectedMhs.lama_studi;
        }
        apiGet('getKeperluan').then(res => {
          let opt = `<option value="">-- Pilih Keperluan --</option>`;
          if(res.status === 'success') res.data.forEach(k => opt += `<option value="${k}">${k}</option>`);
          document.getElementById('mhs-keperluan').innerHTML = opt;
        });
      } else { document.getElementById('header-title').innerText = "Antrean Data"; renderMainDataTable(); }
    }

    async function doSubmitPermohonan(e) {
      e.preventDefault();
      const payload = {
        nim: appState.selectedMhs.nim, nama: appState.selectedMhs.nama, prodi: appState.selectedMhs.prodi,
        semester: document.getElementById('mhs-semester').value, tahun_akademik: document.getElementById('mhs-tahun-akad').value,
        ortu_nama: document.getElementById('ortu-nama').value, ortu_nip: document.getElementById('ortu-nip').value || "-",
        ortu_pangkat: document.getElementById('ortu-pangkat').value || "-", ortu_instansi: document.getElementById('ortu-instansi').value,
        no_hp: document.getElementById('mhs-hp').value, tujuan: document.getElementById('mhs-keperluan').value
      };
      showToast("Menyimpan", "Mengirim data ke server...", "fa-spinner fa-spin");
      try {
        const res = await apiPost('simpanPengajuan', payload);
        if(res.status === 'success') { showToast("Sukses", "Data tersimpan.", "fa-check"); changeView('riwayat'); }
        else showToast("Gagal", res.message, "fa-times");
      } catch(e) { showToast("Offline", "Koneksi terputus.", "fa-wifi"); }
    }

    async function renderMainDataTable() {
      document.getElementById('table-body-target').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">Memuat...</td></tr>`;
      try {
        const res = await apiGet('getRiwayat', {role: appState.role, nim: appState.user.nim});
        if(res.status === 'success') { appState.db = res.data; displayTableData(res.data); }
      } catch(e) { displayTableData(appState.db); }
      updateNavBadges();
    }

    function displayTableData(data) {
      const container = document.getElementById('table-body-target');
      if(data.length === 0) return container.innerHTML = `<tr><td colspan="6" class="p-8 text-center">Tidak ada data.</td></tr>`;
      
      let markup = '';
      data.forEach(d => {
        let badge = d.status === "Selesai" ? `<span class="text-emerald-600 font-bold">Disetujui</span>` : d.status === "Ditolak" ? `<span class="text-rose-600 font-bold">Ditolak</span>` : `<span class="text-amber-600 font-bold">Menunggu</span>`;
        let actionBtn = '';
        if(d.status === "Selesai") { actionBtn = `<button onclick="window.open('${d.link_pdf}', '_blank')" class="bg-rose-600 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold">Lihat PDF</button>`; } 
        else if(appState.role !== "mahasiswa" && d.status === "Menunggu Verifikasi") {
          actionBtn = `<div class="flex gap-1 justify-center"><button onclick="openPreviewModal('${d.id}')" class="bg-slate-900 text-white px-2 py-1 rounded-lg text-[10px]">Cek</button><button onclick="doApproveSurat('${d.id}')" class="bg-emerald-600 text-white px-2 py-1 rounded-lg text-[10px]">ACC</button><button onclick="openRejectModal('${d.id}')" class="bg-rose-100 text-rose-600 px-2 py-1 rounded-lg text-[10px]">Tolak</button></div>`;
        }
        markup += `<tr class="border-b"><td class="p-4">${d.tanggal}</td><td class="p-4 font-mono text-xs">${d.no_surat}</td><td class="p-4 font-bold">${d.nama}<br><span class="font-normal text-xs text-slate-400">${d.nim}</span></td><td class="p-4 text-xs">${d.tujuan}</td><td class="p-4 text-center">${badge}</td><td class="p-4 text-center">${actionBtn}</td></tr>`;
      });
      container.innerHTML = markup;
    }

    function updateNavBadges() {
      const pending = appState.db.filter(d => d.status === "Menunggu Verifikasi").length;
      if(document.getElementById('badge-nav-pending')) document.getElementById('badge-nav-pending').innerText = pending;
    }

    async function doApproveSurat(id) {
      showToast("Memproses PDF", "Membuat dan menyetujui surat...", "fa-spinner fa-spin");
      try {
        const res = await apiPost('setujuiPengajuan', {idSurat: id, adminName: appState.user.name});
        if(res.status === 'success') { showToast("Selesai", "PDF dibuat.", "fa-check"); renderMainDataTable(); }
        else showToast("Gagal", res.message, "fa-times");
      } catch(e) { showToast("Offline", "Koneksi terputus.", "fa-wifi"); }
    }

    function openRejectModal(id) { appState.rejectTargetId = id; document.getElementById('reject-modal').classList.remove('hide'); }
    function closeRejectModal() { appState.rejectTargetId = null; document.getElementById('reject-modal').classList.add('hide'); }
    async function submitRejectForm() {
      const alasan = document.getElementById('reject-reason').value.trim();
      if(!alasan) return alert("Isi alasan!");
      showToast("Menolak", "Memproses...", "fa-spinner fa-spin");
      try {
        const res = await apiPost('tolakPengajuan', {idSurat: appState.rejectTargetId, alasan: alasan, adminName: appState.user.name});
        if(res.status === 'success') { showToast("Ditolak", "Surat ditolak.", "fa-check"); closeRejectModal(); renderMainDataTable(); }
      } catch(e) { showToast("Error", "Gagal menghubungi server", "fa-wifi"); }
    }

    function openPreviewModal(id) {
      const doc = appState.db.find(d => d.id === id);
      document.getElementById('kertas-pdf-preview').innerHTML = `<h3 class="font-bold text-center">PRATINJAU DATA MENTAH</h3><br><p><strong>Nama:</strong> ${doc.nama}<br><strong>NIM:</strong> ${doc.nim}<br><strong>Prodi:</strong> ${doc.prodi}<br><strong>Nama Ortu:</strong> ${doc.ortu_nama}<br><strong>Instansi Ortu:</strong> ${doc.ortu_instansi}</p>`;
      document.getElementById('pdf-modal').classList.remove('hide');
    }
    function closeModal() { document.getElementById('pdf-modal').classList.add('hide'); }

    function fetchDatabaseMetrics() {
      if(document.getElementById('stat-total')) document.getElementById('stat-total').innerText = appState.db.length;
      if(document.getElementById('stat-pending')) document.getElementById('stat-pending').innerText = appState.db.filter(d => d.status === "Menunggu Verifikasi").length;
      if(document.getElementById('stat-done')) document.getElementById('stat-done').innerText = appState.db.filter(d => d.status === "Selesai").length;
      if(document.getElementById('stat-rejected')) document.getElementById('stat-rejected').innerText = appState.db.filter(d => d.status === "Ditolak").length;
    }
    function handleFilterTable(input) {
      const query = input.value.toLowerCase();
      document.querySelectorAll('#main-table-data tbody tr').forEach(row => { row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none'; });
    }
    function showToast(title, desc, iconClass) {
      const toast = document.getElementById('app-toast');
      document.getElementById('toast-title').innerText = title; document.getElementById('toast-desc').innerText = desc;
      document.getElementById('toast-icon-box').innerHTML = `<i class="fas ${iconClass}"></i>`;
      toast.classList.remove('hide'); setTimeout(() => toast.classList.add('hide'), 4000);
    }
  </script>
</body>
</html>
