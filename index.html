<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- PROTEKSI 4: CONTENT SECURITY POLICY (CSP) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://script.google.com https://*.googleusercontent.com https://www.google.com/recaptcha/; img-src 'self' data: https://quickchart.io blob:; frame-src 'self' https://www.google.com/recaptcha/;">
  
  <title>E-Surat BAAK POLTERA (Secured)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- RECAPTCHA V3 SCRIPT -->
  <script src="https://www.google.com/recaptcha/api.js?render=6LcktV0tAAAAACumzpws0R_UxCoVnTtgbbFisq4E"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
    .hide { display: none !important; }
  </style>
</head>
<body class="text-slate-800">

  <!-- ==================== UI HTML (SAMA SEPERTI SEBELUMNYA) ==================== -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center relative bg-gradient-to-br from-poltera-dark via-slate-800 to-poltera-navy p-4">
    <!-- Logika Form HTML di sini (Copy paste dari form UI Anda sebelumnya) -->
    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center relative z-10">
        <h1 class="text-2xl font-extrabold mb-4">E-SURAT POLTERA</h1>
        <div id="role-selection-section" class="space-y-3.5">
            <button onclick="bukaFormKredensial('mahasiswa')" class="w-full p-4 bg-slate-50 border rounded-xl text-left font-bold">Portal Mahasiswa</button>
            <button onclick="bukaFormKredensial('admin')" class="w-full p-4 bg-slate-50 border rounded-xl text-left font-bold">Portal Admin</button>
        </div>
        <div id="credential-form-section" class="hide space-y-4">
            <button onclick="kembaliKePilihanRole()" class="text-slate-400 font-bold text-left mb-2">Kembali</button>
            <form id="login-auth-form" onsubmit="prosesVerifikasiKredensial(event)">
                <input type="text" id="auth-username" required oninput="validasiInput(this)" placeholder="ID Pengguna" class="w-full p-3 border rounded-lg mb-3">
                <input type="password" id="auth-password" placeholder="Password (Admin)" class="w-full p-3 border rounded-lg mb-4">
                <button type="submit" class="w-full bg-poltera-navy text-white font-bold py-3 rounded-xl">LOGIN SECURE</button>
            </form>
        </div>
    </div>
  </div>

  <div id="app-screen" class="hide flex h-screen overflow-hidden">
    <!-- UI Dashboard HTML di sini -->
    <main class="flex-1 overflow-y-auto p-6 bg-slate-50" id="view-wrapper"></main>
  </div>
  
  <div id="app-toast" class="fixed bottom-5 right-5 bg-white border-l-4 border-slate-900 shadow-2xl rounded-xl px-5 py-4 hide z-50">
    <h5 class="font-bold text-xs" id="toast-title">Notifikasi</h5><p class="text-[10px]" id="toast-desc">Memproses...</p>
  </div>

  <template id="view-riwayat">
    <div class="bg-white rounded-2xl border p-5"><table class="w-full text-left" id="main-table-data"><thead><tr><th>Tgl</th><th>NIM</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="table-body-target"></tbody></table></div>
  </template>


  <!-- ==================== SCRIPT SECURITY ==================== -->
  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzeMR30NCObTpwZOmEZ4RafoFMzMKSsAFeN1nJs0kSGY2c4PMnDo3-X8XOoE8qtaF1kVw/exec"; 
    const RECAPTCHA_SITE_KEY = "6LcktV0tAAAAACumzpws0R_UxCoVnTtgbbFisq4E";

    let appState = { role: null, user: null, currentView: 'riwayat', db: [] };

    function escapeHTML(str) {
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag]));
    }

    async function apiGet(action, params = {}) {
      const url = new URL(GAS_API_URL);
      url.searchParams.append('action', action);
      for(let key in params) url.searchParams.append(key, params[key]);
      return await fetch(url).then(r => r.json());
    }

    async function apiPost(action, payload) {
      const form = new URLSearchParams();
      form.append('action', action);
      form.append('data', JSON.stringify(payload));
      return await fetch(GAS_API_URL, { method: 'POST', body: form }).then(r => r.json());
    }

    function validasiInput(input) {
      if (selectedAuthRole === 'mahasiswa') input.value = input.value.replace(/[^0-9]/g, '');
    }

    let selectedAuthRole = '';
    function bukaFormKredensial(role) {
      selectedAuthRole = role;
      document.getElementById('role-selection-section').classList.add('hide');
      document.getElementById('credential-form-section').classList.remove('hide');
    }
    function kembaliKePilihanRole() {
        document.getElementById('credential-form-section').classList.add('hide');
        document.getElementById('role-selection-section').classList.remove('hide');
    }

    // PROTEKSI 1: LOGIN DENGAN GOOGLE RECAPTCHA V3
    async function prosesVerifikasiKredensial(event) {
      event.preventDefault();
      const userVal = document.getElementById('auth-username').value.trim();
      const passVal = document.getElementById('auth-password').value;

      showToast("Memproses...", "Verifikasi Keamanan (Bot Check)...");
      
      try {
        grecaptcha.ready(function() {
          grecaptcha.execute(RECAPTCHA_SITE_KEY, {action: 'login'}).then(async function(token) {
            showToast("Memproses...", "Menghubungi server POLTERA...");
            
            if (selectedAuthRole === 'mahasiswa') {
               // Mahasiswa Login
               const res = await apiGet('cekNIM', {nim: userVal});
               if(res.status === 'success') { appState.role = 'mahasiswa'; masukKeSistem(); }
            } else {
               // Admin Login (POST) dengan Kredensial dan Token Captcha
               const payload = { username: userVal, password: passVal, captcha: token };
               const res = await apiPost('loginAdmin', payload);
               if (res.status === 'success') {
                  appState.role = res.role;
                  appState.user = { username: userVal, password: passVal }; // Simpan utk aksi admin selanjutnya
                  masukKeSistem();
               } else { alert(res.message); }
            }
          });
        });
      } catch (e) { alert("Error sistem"); }
    }

    function masukKeSistem() {
      document.getElementById('login-screen').classList.add('hide');
      document.getElementById('app-screen').classList.remove('hide');
      document.getElementById('view-wrapper').innerHTML = document.getElementById(`view-riwayat`).content.cloneNode(true);
      renderMainDataTable();
    }

    async function renderMainDataTable() {
      const res = await apiGet('getRiwayat', {role: appState.role, nim: 'all'});
      appState.db = res.data;
      const container = document.getElementById('table-body-target');
      
      let markup = '';
      res.data.forEach(d => {
        let actionBtn = '';
        
        // PROTEKSI 2: TOMBOL UNDUH MENGGUNAKAN FUNGSI STREAMING SECURE, BUKAN LINK DRIVE TERBUKA
        if(d.status === "Selesai") { 
            actionBtn = `<button onclick="downloadPDFSecure('${d.id}')" class="bg-blue-600 text-white px-3 py-1 rounded">Unduh Berkas</button>`; 
        } 
        else if(appState.role === "admin" && d.status === "Menunggu Verifikasi") {
            actionBtn = `<button onclick="doApproveSurat('${d.id}')" class="bg-emerald-600 text-white px-2 py-1 rounded">ACC</button>`;
        }
        
        // PROTEKSI XSS (ESCAPE HTML SAAT RENDER)
        markup += `<tr class="border-b"><td>${escapeHTML(d.tanggal)}</td><td>${escapeHTML(d.nim)}</td><td>${escapeHTML(d.status)}</td><td>${actionBtn}</td></tr>`;
      });
      container.innerHTML = markup;
    }

    // PROTEKSI 2: PENGAMBILAN DOKUMEN MELALUI STREAMING (API GET BLOB)
    async function downloadPDFSecure(idSurat) {
        showToast("Mengunduh", "Mengambil data aman dari server...");
        try {
            // Gunakan kredensial Admin jika yang login Admin (Otorisasi Ganda)
            const params = { idSurat: idSurat };
            if(appState.role === 'admin') {
                params.adminUser = appState.user.username;
                params.adminPass = appState.user.password;
            }
            
            const res = await apiGet('downloadDokumenSecure', params);
            if(res.status !== 'success') throw new Error(res.message);
            
            // Konversi Base64 ke File Virtual di Klien dan Otomatis Download
            const byteCharacters = atob(res.base64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
            const byteArray = new Uint8Array(byteNumbers);
            const fileBlob = new Blob([byteArray], {type: res.mimeType});
            
            const fileUrl = URL.createObjectURL(fileBlob);
            const a = document.createElement('a');
            a.href = fileUrl; a.download = res.fileName; document.body.appendChild(a);
            a.click(); URL.revokeObjectURL(fileUrl);
            
            showToast("Sukses", "Dokumen berhasil diunduh.");
        } catch(e) { alert("Gagal mengunduh: " + e.message); }
    }

    // PROTEKSI 3: AKSI ADMIN WAJIB MELAMPIRKAN USERNAME & PASSWORD YANG AKAN DIVALIDASI KEMBALI OLEH SERVER
    async function doApproveSurat(id) {
      showToast("Memproses", "Menyetujui surat...");
      const payload = {
        idSurat: id, 
        adminUser: appState.user.username,
        adminPass: appState.user.password
      };
      const res = await apiPost('setujuiPengajuan', payload);
      if(res.status === 'success') { alert("Disetujui!"); renderMainDataTable(); }
    }

    function showToast(t, d) { 
        document.getElementById('toast-title').innerText = t; 
        document.getElementById('toast-desc').innerText = d; 
        document.getElementById('app-toast').classList.remove('hide'); 
        setTimeout(() => document.getElementById('app-toast').classList.add('hide'), 3000); 
    }
  </script>
</body>
</html>
